# Findings below this severity are not reported (cuts run-to-run noise). INFO = report all.
min_severity: LOW
# Severities that block the merge.
fail_on: [CRITICAL, HIGH]
# true = let the PR pass when the review itself could not run (API down, no key).
fail_open_on_error: false
# Larger diffs are not truncated; they fail with a "too large" finding.
max_diff_chars: 150000
# Sonnet 5.5: Haiku raised a different false HIGH on most runs (seen in kyb-investigator and in this
# repo's v2 PR). For deeper reviews: model: claude-opus-5-5, effort: high.
model: claude-sonnet-5-5
effort: medium
# Safety-classifier declines are re-run server-side on the recommended fallback model.
fallbacks: default
# Files left out of the reviewed diff (fnmatch patterns on the file path).
excluded_patterns:
  - "*.lock"
  - "*lock.json"
  - "*.min.js"
  - "*.png"
  - "*.jpg"
  - "*.gif"
  - "*.pdf"
  - "dist/*"
