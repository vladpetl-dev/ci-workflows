[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-workflows-tools"
version = "1.0.0"
description = "AI PR review gate, coverage gate and release tooling used by vladpetl-dev reusable workflows"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11,<2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["review", "scripts", "covgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
